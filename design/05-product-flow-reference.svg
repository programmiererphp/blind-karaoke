  <text x="308" y="766" text-anchor="middle" style="font:700 15px Inter,Arial;fill:#6d3ff2">Mit Freunden singen</text><rect x="606" y="282" width="882" height="600" rx="28" fill="#fff" filter="url(#shadow)"/><text x="648" y="336" class="t2 ink">Showcase Flow</text><circle cx="654" cy="410" r="28" fill="#ff2d7a"/><text x="654" y="416" text-anchor="middle" style="font:700 14px Inter,Arial;fill:#fff">1</text><text x="654" y="462" text-anchor="middle" class="small ink">Präferenzen</text><path d="M 692 410 H 780" stroke="#d8dce5" stroke-width="3" marker-end="url(#none)"/><circle cx="818" cy="410" r="28" fill="#f3efff"/><text x="818" y="416" text-anchor="middle" style="font:700 14px Inter,Arial;fill:#6d3ff2">2</text><text x="818" y="462" text-anchor="middle" class="small ink">Match</text><path d="M 856 410 H 944" stroke="#d8dce5" stroke-width="3" marker-end="url(#none)"/><circle cx="982" cy="410" r="28" fill="#f3efff"/><text x="982" y="416" text-anchor="middle" style="font:700 14px Inter,Arial;fill:#6d3ff2">3</text><text x="982" y="462" text-anchor="middle" class="small ink">Bestätigen</text><path d="M 1020 410 H 1108" stroke="#d8dce5" stroke-width="3" marker-end="url(#none)"/><circle cx="1146" cy="410" r="28" fill="#f3efff"/><text x="1146" y="416" text-anchor="middle" style="font:700 14px Inter,Arial;fill:#6d3ff2">4</text><text x="1146" y="462" text-anchor="middle" class="small ink">Singen</text><path d="M 1184 410 H 1272" stroke="#d8dce5" stroke-width="3" marker-end="url(#none)"/><circle cx="1310" cy="410" r="28" fill="#f3efff"/><text x="1310" y="416" text-anchor="middle" style="font:700 14px Inter,Arial;fill:#6d3ff2">5</text><text x="1310" y="462" text-anchor="middle" class="small ink">Verbinden</text><rect x="648" y="518" width="370" height="284" rx="20" class="softpink"/><text x="678" y="560" class="t3 ink">Blind Match</text><text x="678" y="592" class="body muted">• Ort und Zeit zuerst</text><text x="678" y="624" class="body muted">• gegenseitige Präferenzen</text><text x="678" y="656" class="body muted">• Musik nur als weiches Signal</text><text x="678" y="688" class="body muted">• Identität erst nach Bestätigung</text><rect x="1050" y="518" width="396" height="284" rx="20" class="soft"/><text x="1080" y="560" class="t3 ink">Karaoke Room</text><text x="1080" y="592" class="body muted">• gemeinsame Realtime-Queue</text><text x="1080" y="624" class="body muted">• externe Karaoke-Links</text><text x="1080" y="656" class="body muted">• Duett Roulette</text><text x="1080" y="688" class="body muted">• privates Feedback danach</text><rect x="48" y="922" width="1440" height="62" rx="18" fill="#fff"/><text x="136" y="960" class="t3 pink">D1</text><text x="190" y="960" class="body ink">Echte Zwei-Browser-Nutzung · Firebase Realtime · keine Fake-Buttons · kein öffentlicher Profilfeed · keine KI-Abhängigkeit</text></svg>