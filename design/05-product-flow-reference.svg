  <text x="48" y="94" class="body muted">Desktop-Übersicht für die Implementierung: Fokus auf Blind Match, Duo-Room und reale Treffen.</text><rect x="48" y="142" width="1440" height="106" rx="24" fill="#fff" filter="url(#shadow)"/>
<text x="84" y="184" class="t2 ink">Blind Karaoke</text><text x="84" y="214" class="body muted">Sing together. Meet naturally.</text>
