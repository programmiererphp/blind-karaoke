name: Deployed App QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployed-qa.yml'
      - 'qa/e2e/**'

permissions:
  contents: write

jobs:
  deployed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://blind-karaoke-663424522262.us-west1.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed smoke and discovery QA
        run: |
          node qa/e2e/deployed-smoke.mjs
          node qa/e2e/deployed-d1.mjs\n          node qa/e2e/deployed-d1-deep.mjs
      - name: Commit selected deployment screenshots
        if: always()
        run: |
          mkdir -p design/screenshots
          cp -f qa-artifacts-d1/00-home.png design/screenshots/home-mobile.png 2>/dev/null || true
          cp -f qa-artifacts-d1/MinaQA-01-filled.png design/screenshots/preferences-mobile.png 2>/dev/null || true
          cp -f qa-artifacts-d1/08-A-room-nav.png design/screenshots/no-active-room-mobile.png 2>/dev/null || true
          cp -f qa-artifacts-d1/11-friends-click.png design/screenshots/friends-cta-no-change-mobile.png 2>/dev/null || true
          cp -f qa-artifacts/06-home-desktop.png design/screenshots/home-desktop.png 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "qa: update deployed app screenshots"
            git push
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-qa-evidence
          path: |
            qa-artifacts/
            qa-artifacts-d1/
          if-no-files-found: warn
          retention-days: 14
