<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
<defs>
<style>
.bg{fill:#f8fafc}.paper{fill:#fff}.ink{fill:#15172b}.muted{fill:#697086}.pink{fill:#f43f7b}.purple{fill:#7c3aed}.soft{fill:#f5f3ff}.green{fill:#ecfdf5}.red{fill:#fff1f2}.line{stroke:#e5e7eb;stroke-width:2}
.h1{font:700 38px Arial,sans-serif}.h2{font:700 24px Arial,sans-serif}.h3{font:700 17px Arial,sans-serif}.body{font:400 14px Arial,sans-serif}.small{font:400 12px Arial,sans-serif}
</style>
<filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".1"/></filter>
</defs>
<rect class="bg" width="1500" height="950"/>
<text x="50" y="62" class="h1 ink">Meetup Planner — Vorschlag & Gegenvorschlag</text>
<text x="50" y="92" class="body muted">Zwei zentrale D2-Entscheidungen: einen konkreten Termin senden und auf den aktuellen Vorschlag reagieren.</text><g filter="url(#sh)"><rect x="150" y="150" width="500" height="700" rx="26" class="paper"/>
<line x1="150" y1="208" x2="650" y2="208" class="line"/>
<text x="170" y="186" class="h3 ink">Treffen vorschlagen</text></g><g filter="url(#sh)"><rect x="850" y="150" width="500" height="700" rx="26" class="paper"/>
<line x1="850" y1="208" x2="1350" y2="208" class="line"/>
<text x="870" y="186" class="h3 ink">Vorschlag erhalten</text></g><text x="190" y="250" class="small muted">Datum</text><rect x="190" y="260" width="420" height="44" rx="10" fill="#fff" stroke="#dfe3ea"/><text x="202" y="288" class="body ink">Freitag, 05.09.2026</text><text x="190" y="330" class="small muted">Uhrzeit</text><rect x="190" y="340" width="420" height="44" rx="10" fill="#fff" stroke="#dfe3ea"/><text x="202" y="368" class="body ink">20:00</text><text x="190" y="410" class="small muted">Treffpunkt / Karaoke-Bar</text><rect x="190" y="420" width="420" height="44" rx="10" fill="#fff" stroke="#dfe3ea"/><text x="202" y="448" class="body ink">Karaoke Bar XYZ</text><text x="190" y="490" class="small muted">Adresse (optional)</text><rect x="190" y="500" width="420" height="44" rx="10" fill="#fff" stroke="#dfe3ea"/><text x="202" y="528" class="body ink">Bahnhofstraße 12, Göttingen</text><text x="190" y="570" class="small muted">Notiz (optional)</text><rect x="190" y="580" width="420" height="44" rx="10" fill="#fff" stroke="#dfe3ea"/><text x="202" y="608" class="body ink">Ich reserviere einen Tisch.</text><rect x="190" y="680" width="420" height="48" rx="13" fill="#7c3aed"/><text x="400" y="710" text-anchor="middle" style="font:700 14px Arial;fill:#fff">Vorschlag senden</text><rect x="890" y="250" width="420" height="230" rx="16" class="soft"/><text x="908" y="280" class="h3 ink">Alex schlägt vor</text><text x="908" y="310" class="body ink">Freitag, 05.09.2026 · 20:00</text><text x="908" y="336" class="body muted">Karaoke Bar XYZ</text><text x="908" y="362" class="body muted">Bahnhofstraße 12, Göttingen</text><text x="908" y="388" class="body muted">Notiz: Ich reserviere einen Tisch.</text><rect x="890" y="525" width="420" height="48" rx="13" fill="#7c3aed"/><text x="1100" y="555" text-anchor="middle" style="font:700 14px Arial;fill:#fff">Vorschlag annehmen</text><rect x="890" y="590" width="420" height="48" rx="13" fill="#fff" stroke="#7c3aed"/><text x="1100" y="620" text-anchor="middle" style="font:700 14px Arial;fill:#6d28d9">Anderen Termin vorschlagen</text><rect x="890" y="655" width="420" height="48" rx="13" fill="#fff1f2" stroke="#ef4444"/><text x="1100" y="685" text-anchor="middle" style="font:700 14px Arial;fill:#dc2626">Treffen nicht planen</text><rect x="890" y="735" width="420" height="70" rx="14" class="soft"/><text x="910" y="764" class="h3 ink">Gegenvorschlag ersetzt den aktuellen Vorschlag</text><text x="910" y="790" class="small muted">Die alte Version darf danach nicht mehr akzeptiert werden.</text></svg>