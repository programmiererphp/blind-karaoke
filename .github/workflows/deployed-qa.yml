name: Deployed App QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployed-qa.yml'
      - 'qa/e2e/**'

permissions:
  contents: read

jobs:
  deployed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://blind-karaoke-663424522262.us-west1.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed smoke and discovery QA
        run: |\n          node qa/e2e/deployed-smoke.mjs\n          node qa/e2e/deployed-d1.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-qa-evidence
          path: |\n            qa-artifacts/\n            qa-artifacts-d1/
          if-no-files-found: warn
          retention-days: 14
